# MotionEye 主配置文件
# 针对 PaaS 平台 1C1G 低资源环境优化

# 配置文件路径
conf_path /etc/motioneye

# 运行时路径
run_path /var/run/motioneye

# 日志路径
log_path /var/log/motioneye

# 媒体文件路径（录像存储）
media_path /var/lib/motioneye

# 监听地址（容器内允许所有连接）
listen 0.0.0.0

# 默认端口（entrypoint.sh 会根据 $PORT 动态修改）
port 8080

# 运动检测守护进程路径
motion_binary /usr/bin/motion

# 日志级别（生产环境使用 warning 减少 IO）
log_level warning

# 关闭自动更新检查（容器环境无需）
motion_check_interval 0
