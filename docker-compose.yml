version: '3.8'

services:
  nvr:
    # 如果已经推送到 Docker Hub 或 GHCR，可以使用现成的镜像
    # image: ghcr.io/workerspages/nvr-ffmpeg-rclone:latest
    # 或者本地构建
    build: .
    container_name: nvr-rclone
    restart: always
    ports:
      - "8080:8080"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PORT=${PORT:-8080}
      - CLOUDFLARE_TOKEN=${CLOUDFLARE_TOKEN:-}
      - CF_ACCESS_HOSTNAME_1=${CF_ACCESS_HOSTNAME_1:-}
      - CAMERA_URL_1=${CAMERA_URL_1:-rtsp://user:pass@10.x.x.x:554/stream}
      - CAMERA_SUB_URL_1=${CAMERA_SUB_URL_1:-}
      - CAMERA_USERNAME_1=${CAMERA_USERNAME_1:-}
      - CAMERA_PASSWORD_1=${CAMERA_PASSWORD_1:-}
      - CF_ACCESS_HOSTNAME_2=${CF_ACCESS_HOSTNAME_2:-}
      - CAMERA_URL_2=${CAMERA_URL_2:-}
      - CAMERA_SUB_URL_2=${CAMERA_SUB_URL_2:-}
      - CAMERA_USERNAME_2=${CAMERA_USERNAME_2:-}
      - CAMERA_PASSWORD_2=${CAMERA_PASSWORD_2:-}
      - MOONFIRE_RETENTION_GB=${MOONFIRE_RETENTION_GB:-2}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-300}
      - RCLONE_MAX_SIZE=${RCLONE_MAX_SIZE:-10}
      - RCLONE_REMOTE=${RCLONE_REMOTE:-remote:nvr-backup}
    volumes:
      # 持久化 Moonfire NVR 数据（数据库 + 录像缓存）
      - moonfire-data:/var/lib/moonfire-nvr
      # 将宿主机的 rclone.conf 挂载到容器内
      # 请确保宿主机上有这个文件，并配置好网盘
      - ./rclone_config/rclone.conf:/config/rclone/rclone.conf:ro

volumes:
  moonfire-data:
