version: '3.8'

services:
  nvr:
    # 如果已经推送到 Docker Hub 或 GHCR，可以使用现成的镜像
    # image: ghcr.io/workerspages/nvr-ffmpeg-rclone:latest
    # 或者本地构建
    build: .
    container_name: nvr-rclone
    restart: always
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      # 替换为你的 Cloudflare Tunnel Token（如果不需要暴露服务，可不填）
      - CLOUDFLARE_TOKEN=your_cloudflare_tunnel_token
      # 如果你在家用 Cloudflare 暴露了摄像头的 TCP 端口，填入你的域名（例如 camera.yourdomain.com）
      - CF_ACCESS_HOSTNAME_1=
      # 如果你设置了 CF_ACCESS_HOSTNAME_1，请将摄像头 URL 的 IP/域名 改为 127.0.0.1:5554
      # 否则，请替换为你的网络摄像头真实 URL
      - CAMERA_URL_1=rtsp://user:pass@10.x.x.x:554/stream
      # 支持添加第 2 个摄像头：
      # - CF_ACCESS_HOSTNAME_2=
      # - CAMERA_URL_2=rtsp://127.0.0.1:5555/stream
      # Rclone 同步时间间隔（秒），默认 300
      - SYNC_INTERVAL=300
      # 远程网盘存储上限（GB），超过后自动删除最早文件，0=不限制
      - RCLONE_MAX_SIZE=10
      # Rclone 远程目标
      - RCLONE_REMOTE=remote:nvr-backup
      # 注意：RCLONE_CONFIG_BASE64 这里不需要配置，我们使用本地挂载的方式
    volumes:
      # 将宿主机的 rclone.conf 挂载到容器内
      # 请确保宿主机上有这个文件，并配置好网盘
      - ./rclone_config/rclone.conf:/config/rclone/rclone.conf:ro
      # 如果你想在宿主机也保留一份录像文件，解除下行注释
      # - ./media:/var/lib/motioneye
